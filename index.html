
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIZO GAMES</title>
<style>
:root {
  --gold:#e8bd55;
  --bg:#090909;
  --panel:#171717;
  --muted:#aaa;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Tahoma,sans-serif;
}
header {
  padding:22px;
  text-align:center;
  border-bottom:1px solid #383020;
}
.logo {
  color:var(--gold);
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}
main {
  width:min(600px,92%);
  margin:35px auto;
}
h1 { font-size:25px }
p { color:var(--muted);line-height:1.7 }
.panel {
  background:var(--panel);
  border:1px solid #393020;
  border-radius:16px;
  padding:20px;
  margin:18px 0;
}
input,select {
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:9px;
  border:1px solid #444;
  background:#101010;
  color:white;
  font-size:16px;
}
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:9px;
  background:var(--gold);
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button.secondary {
  background:#292929;
  color:white;
  border:1px solid #555;
}
.room-code {
  color:var(--gold);
  font-size:28px;
  font-weight:bold;
  letter-spacing:5px;
}
.hidden { display:none }
.players {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.player {
  background:#292929;
  padding:10px;
  border-radius:8px;
}
.note {
  font-size:13px;
  color:#999;
}
</style>
</head>
<body>

<header>
  <div class="logo">ZIZO GAMES</div>
  <p>ONLINE AUCTION ROOMS</p>
</header>

<main>
  <section id="home">
    <h1>غرف المزاد ⚽</h1>
    <p>أنشئ غرفة جديدة أو انضم إلى غرفة أصدقائك.</p>

    <div class="panel">
      <h2>إنشاء غرفة</h2>
      <input id="hostName" placeholder="اسمك">
      <select id="auctionType">
        <option value="5">مزاد 5 لاعبين</option>
        <option value="7">مزاد 7 لاعبين</option>
        <option value="11">مزاد 11 لاعبًا</option>
        <option value="18">مزاد المليون - 18 لاعبًا</option>
      </select>
      <select id="budget">
        <option value="100">ميزانية 100 مليون</option>
        <option value="150">ميزانية 150 مليون</option>
        <option value="200">ميزانية 200 مليون</option>
      </select>
      <select id="maxPlayers">
        <option value="2">لاعبان</option>
        <option value="3">3 لاعبين</option>
        <option value="4">4 لاعبين</option>
        <option value="5">5 لاعبين</option>
      </select>
      <button onclick="createRoom()">إنشاء الغرفة</button>
    </div>

    <div class="panel">
      <h2>الانضمام لغرفة</h2>
      <input id="joinName" placeholder="اسمك">
      <input id="joinCode" placeholder="كود الغرفة">
      <button class="secondary" onclick="joinRoom()">دخول الغرفة</button>
    </div>
  </section>

  <section id="room" class="hidden">
    <h1>غرفة المزاد</h1>
    <div class="panel">
      <p>كود الغرفة</p>
      <div class="room-code" id="displayCode"></div>
      <p id="roomInfo"></p>
      <h3>اللاعبون</h3>
      <div class="players" id="players"></div>
      <button id="startButton" onclick="startAuction()">بدء المزاد</button>
      <button class="secondary" onclick="leaveRoom()">مغادرة الغرفة</button>
    </div>
    <div class="panel hidden" id="auctionPanel">
      <h2>المزاد</h2>
      <p id="auctionStatus">المزاد بدأ!</p>
      <p class="note">هذه واجهة تجريبية، ولم يتم ربط المزايدات المباشرة بعد.</p>
    </div>
  </section>
</main>

<script>
let currentRoom = null;
let currentPlayer = null;

function makeCode() {
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

function createRoom() {
  const name = document.getElementById("hostName").value.trim();
  if (!name) return alert("اكتب اسمك أولاً");

  currentPlayer = name;
  currentRoom = {
    code: makeCode(),
    host: name,
    type: document.getElementById("auctionType").value,
    budget: document.getElementById("budget").value,
    max: Number(document.getElementById("maxPlayers").value),
    players: [name],
    started: false
  };

  showRoom();
}

function joinRoom() {
  const name = document.getElementById("joinName").value.trim();
  const code = document.getElementById("joinCode").value.trim().toUpperCase();

  if (!name || !code) return alert("اكتب اسمك وكود الغرفة");
  alert("الانضمام عبر الإنترنت غير متاح في هذه النسخة التجريبية. يلزم ربط Firebase أولاً.");
}

function showRoom() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("room").classList.remove("hidden");
  document.getElementById("displayCode").textContent = currentRoom.code;
  document.getElementById("roomInfo").textContent =
    "نوع المزاد: " + currentRoom.type +
    " لاعب | الميزانية: " + currentRoom.budget + " مليون";

  document.getElementById("players").innerHTML =
    currentRoom.players.map(p =>
      '<div class="player">' + escapeHTML(p) + '</div>'
    ).join("");

  document.getElementById("startButton").style.display =
    currentRoom.host === currentPlayer ? "block" : "none";
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function startAuction() {
  if (currentPlayer !== currentRoom.host) return;
  currentRoom.started = true;
  document.getElementById("auctionPanel").classList.remove("hidden");
  document.getElementById("auctionStatus").textContent =
    "تم فتح المزاد التجريبي!";
}

function leaveRoom() {
  currentRoom = null;
  currentPlayer = null;
  document.getElementById("room").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}
</script>
</body>
</html>
